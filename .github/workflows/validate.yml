name: Validate guide and examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Check reading editions (not gameplay)
        run: npm run check:reading-examples
      - name: Check tooling and fixture regressions
        run: npm test
      - name: Check repository-relative Markdown links
        run: npm run check:links
